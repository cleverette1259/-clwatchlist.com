  <style>
    :root { --accent-hue: 0; --text-scale: 1; --text-color: #ffffff; --app-font: 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    body { font-family: var(--app-font); margin: 0; height: 100vh; color: var(--text-color); overflow: hidden; background: #000; display: flex; }
    /* Buttons, inputs, and selects don't inherit font/color by default in most browsers — force it so the font/color/size changer reaches them too */
    button, input, select, textarea { font-family: inherit; color: inherit; }

    /* --- Custom Scrollbars --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: hsla(var(--accent-hue), 100%, 50%, 0.5); }

    /* --- Buttons & Badges --- */
    .mist-btn {
      background: hsla(var(--accent-hue), 100%, 50%, 0.1);
      color: var(--text-color); border: 1px solid hsla(var(--accent-hue), 100%, 50%, 0.3);
      cursor: pointer; font-size: calc(10px * var(--text-scale)); padding: 10px; text-transform: uppercase; transition: 0.2s;
    }
    .mist-btn:hover {
      background: hsla(var(--accent-hue), 100%, 50%, 0.2);
      border-color: hsla(var(--accent-hue), 100%, 50%, 1);
    }
    .mist-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .new-badge {
      font-size: calc(7px * var(--text-scale)); background: hsla(var(--accent-hue), 100%, 50%, 1);
      color: #000; padding: 1px 4px; border-radius: 2px; font-weight: 900;
      margin-left: 8px; box-shadow: 0 0 8px hsla(var(--accent-hue), 100%, 50%, 0.5);
    }

    /* --- Sidebars --- */
    #sidebar-left { width: 60px; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; z-index: 500; transition: background 0.3s, border-color 0.3s; }
    #sidebar-left.bar-transparent { background: transparent; border-right-color: transparent; backdrop-filter: none; }
    #sidebar-left.drop-hover { background: rgba(255,255,255,0.05); }
    #menu-tools-dropzone.drop-hover { outline: 1px dashed hsla(var(--accent-hue), 100%, 50%, 0.6); border-radius: 4px; }
    #menu-tools-dropzone:empty::before { content: 'Drag tools here'; display:block; font-size: calc(8px * var(--text-scale)); opacity: 0.25; text-align: center; padding: 8px 0; text-transform: uppercase; letter-spacing: 1px; }
    #menu-tools-dropzone:not(:empty) { border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 5px; }
    #sidebar-right { width: 260px; background: rgba(0,0,0,0.85); backdrop-filter: blur(30px); border-left: 1px solid rgba(255,255,255,0.1); padding: 20px 15px; display: flex; flex-direction: column; gap: 25px; overflow-y: auto; z-index: 400; }

    #url-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-color); padding: 12px; font-size: calc(11px * var(--text-scale)); outline: none; width: 100%; transition: 0.3s; }
    #url-input:focus { border-color: hsla(var(--accent-hue), 100%, 50%, 0.8); }

    /* --- Grid & Cards --- */
    #main-content { flex: 1; padding: 40px; overflow-y: auto; position: relative; z-index: 10; }
    #video-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:20px; position: relative; z-index: 20; }
    .card { background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid rgba(255,255,255,0.08); position: relative; }
    .card-dots { cursor: pointer; opacity: 0.6; font-size: calc(14px * var(--text-scale)); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

    /* --- Context Menus --- */
    .context-menu { position: absolute; background: #111; border: 1px solid #333; z-index: 3000; display: none; width: 160px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .menu-item { position: relative; padding: 10px; font-size: calc(9px * var(--text-scale)); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; color: var(--text-color); }
    .menu-item:hover { background: hsla(var(--accent-hue), 100%, 50%, 0.2); color: #fff; }
    .submenu-inner { position: absolute; right: 100%; top: 0; background: #111; border: 1px solid #333; width: 150px; display: none; z-index: 3100; max-height: 200px; overflow-y: auto; }
    .menu-item:hover > .submenu-inner { display: block; }

    /* --- Folders --- */
    .folder-header { padding: 12px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .folder-name-group { cursor: pointer; display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .folder-content { display: none; padding: 10px 0; border-left: 1px solid rgba(255,255,255,0.05); margin-left: 4px; }
    .folder-content.open { display: block; }
    .folder-link-item { display: flex; flex-direction: column; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.03); position: relative; }

    /* --- Lock Screen --- */
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; transition: 0.8s; }
    #lock-screen.hidden { opacity: 0; pointer-events: none; }
    #lock-title { font-size: calc(9px * var(--text-scale)); opacity: 0.4; letter-spacing: 3px; margin-bottom: 15px; }
    #password, #password-confirm { background:#000; border:1px solid rgba(255,255,255,0.1); color:#fff; padding: 12px; text-align:center; outline:none; margin-bottom:10px; width:220px; z-index: 10001; }

    .bg-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
    video.bg-video, .bg-img-div { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; display: none; opacity: 0; transition: opacity 1s; }
    .bg-visible { opacity: 1 !important; display: block !important; }
  </style>
</head>
<body onclick="closeAllMenus()">

<div id="lock-screen">
  <div class="bg-wrapper">
    <video id="lock-bg-video" class="bg-video" autoplay muted loop playsinline></video>
    <div id="lock-bg-img" class="bg-img-div"></div>
  </div>
  <div id="lock-title">ACCESS KEY</div>
  <input type="password" id="password" placeholder="ACCESS KEY" autocomplete="off">
  <input type="password" id="password-confirm" placeholder="CONFIRM ACCESS KEY" autocomplete="off" style="display:none;">
  <button class="mist-btn" id="loginBtn" style="width:220px;">Unlock</button>
</div>

<div id="sidebar-left" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="handleBarDrop(event); this.classList.remove('drop-hover');">
  <div style="cursor: pointer; font-size: calc(24px * var(--text-scale)); opacity: 0.5;" onclick="toggleSidebarMenu(event)">⋮</div>
  <div id="sidebar-context" class="context-menu" style="left: 65px; top: 20px; padding: 15px; width: 190px; max-height: 80vh; overflow-y: auto;" onclick="event.stopPropagation()">
    <div id="menu-tools-dropzone" ondragover="event.preventDefault(); event.stopPropagation(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="event.stopPropagation(); handleToolDrop(event); this.classList.remove('drop-hover');" style="display:flex; flex-direction:column; gap:6px; min-height:12px;"></div>
    <div style="height: 130px; width: 100%; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <input type="range" id="hue-slider" min="0" max="360" value="0" style="appearance: none; width: 120px; height: 4px; background: #333; transform: rotate(-90deg); cursor: pointer; margin: 0; flex-shrink: 0;">
    </div>
    <div style="border-top: 1px solid #222; padding-top: 10px; margin-top: 5px; display:flex; flex-direction:column; gap:2px;">
      <div class="menu-item" style="border:none;" onclick="togglePasswordLock()">
        <span id="pass-toggle-label">Password Lock: ON</span>
      </div>
      <div class="menu-item" id="change-pass-item" style="border:none;" onclick="changePassword()">
        <span>Change Access Key</span>
      </div>
    </div>
    <div style="border-top: 1px solid #222; padding-top: 10px; margin-top: 8px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:calc(8px * var(--text-scale)); opacity:0.4; letter-spacing:1px;">FONT</label>
        <select id="font-select" style="background:#000; border:1px solid rgba(255,255,255,0.15); font-size:calc(10px * var(--text-scale)); padding:6px; width:100%;">
          <option value="'Segoe UI', sans-serif">Segoe UI</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="custom">Custom (Google Font)…</option>
        </select>
      </div>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:calc(8px * var(--text-scale)); opacity:0.4; letter-spacing:1px;">TEXT COLOR</label>
        <input type="color" id="text-color-picker" value="#ffffff" style="width:100%; height:28px; background:#000; border:1px solid rgba(255,255,255,0.15); padding:2px; cursor:pointer;">
      </div>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:calc(8px * var(--text-scale)); opacity:0.4; letter-spacing:1px;">TEXT SIZE</label>
        <input type="range" id="text-size-slider" min="75" max="150" step="5" value="100" style="width:100%; cursor:pointer;">
      </div>
    </div>
  </div>
  <button class="mist-btn" id="btn-bg-main" draggable="true" ondragstart="handleToolDragStart(event, 'btn-bg-main')" onclick="triggerBG('main')" style="width:40px; font-size:calc(8px * var(--text-scale)); cursor:grab;">BG</button>
  <button class="mist-btn" id="btn-bg-lock" draggable="true" ondragstart="handleToolDragStart(event, 'btn-bg-lock')" onclick="triggerBG('lock')" style="width:40px; font-size:calc(8px * var(--text-scale)); cursor:grab;">BG<span style="font-size:0.6em;">f</span></button>
</div>

<div id="main-content">
  <div class="bg-wrapper">
    <video id="bg-video" class="bg-video" autoplay muted loop playsinline></video>
    <div id="bg-img" class="bg-img-div"></div>
  </div>
  <div id="video-grid"></div>
</div>

<div id="sidebar-right">
  <div class="input-section" style="display:flex; flex-direction:column; gap:8px;">
    <h3 style="font-size: calc(8px * var(--text-scale)); opacity: 0.3; letter-spacing: 2px;">PASTE URL</h3>
    <input type="text" id="url-input" placeholder="URL...">
    <button class="mist-btn" id="addCardBtn">Add to Vault</button>
  </div>

  <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="font-size: calc(8px * var(--text-scale)); opacity: 0.3;">FOLDERS</h3>
      <button class="mist-btn" onclick="createNewFolder()" style="padding:4px 6px; font-size: calc(8px * var(--text-scale));">+ NEW</button>
    </div>
    <div id="folder-tab-list"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let library = JSON.parse(localStorage.getItem('cl_vF_links')) || [];
    let folders = JSON.parse(localStorage.getItem('cl_vF_folders')) || [];
    let openFolders = JSON.parse(localStorage.getItem('cl_vF_openFolders')) || [];
    let db;
    let bgObjectURLs = { main: null, lock: null };

    // --- Password lock state ---
    let passEnabled = localStorage.getItem('cl_vF_passEnabled') !== 'false'; // default ON
    let setupMode = false;

    // --- Appearance state ---
    const FONT_PRESETS = ["'Segoe UI', sans-serif", "Georgia, serif", "'Courier New', monospace", "Verdana, sans-serif", "'Times New Roman', serif"];
    let appFont = localStorage.getItem('cl_vF_font') || FONT_PRESETS[0];
    let textColor = localStorage.getItem('cl_vF_textColor') || '#ffffff';
    let textScale = parseFloat(localStorage.getItem('cl_vF_textScale')) || 1;

    // Helper to escape quotes in strings for inline HTML onclick handlers
    const safeStr = (str) => {
        if (!str) return '';
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    };

    const dbReq = indexedDB.open("VaultMediaDB", 4);
    dbReq.onupgradeneeded = (e) => {
        let database = e.target.result;
        if (!database.objectStoreNames.contains("media")) database.createObjectStore("media");
    };
    dbReq.onsuccess = (e) => { db = e.target.result; init(); };

    function init() {
        updateHue(localStorage.getItem('vault_hue') || 0);
        const tx = db.transaction("media", "readonly");
        tx.objectStore("media").get("currentBG").onsuccess = (e) => {
            if (e.target.result) applyBG('main', e.target.result.data, e.target.result.type === 'v');
        };
        tx.objectStore("media").get("lockBG").onsuccess = (e) => {
            if (e.target.result) applyBG('lock', e.target.result.data, e.target.result.type === 'v');
        };
        render();
        updatePassMenuLabel();
        initLockScreen();
        initAppearanceControls();
    }

    function applyBG(target, data, isVid) {
        const vid = document.getElementById(target === 'lock' ? 'lock-bg-video' : 'bg-video');
        const img = document.getElementById(target === 'lock' ? 'lock-bg-img' : 'bg-img');
        if (bgObjectURLs[target]) { URL.revokeObjectURL(bgObjectURLs[target]); bgObjectURLs[target] = null; }
        vid.style.display='none'; vid.classList.remove('bg-visible'); vid.src="";
        img.style.display='none'; img.classList.remove('bg-visible'); img.style.backgroundImage="";
        const src = (data instanceof Blob) ? (bgObjectURLs[target] = URL.createObjectURL(data)) : data;
        if (isVid) {
            vid.src=src; vid.style.display='block'; vid.classList.add('bg-visible'); vid.load(); vid.play().catch(()=>{});
        } else {
            img.style.backgroundImage=`url(${src})`; img.style.display='block'; img.classList.add('bg-visible');
        }
    }

    window.triggerBG = (target) => {
        const f = document.createElement('input'); f.type='file'; f.accept='image/*,video/*';
        f.onchange = (e) => {
            const file = e.target.files[0]; if(!file) return;
            const isV = file.type.includes('video');
            const key = target === 'lock' ? 'lockBG' : 'currentBG';
            const tx = db.transaction("media", "readwrite");
            tx.objectStore("media").put({ data: file, type: isV ? 'v' : 'i' }, key);
            tx.oncomplete = () => applyBG(target, file, isV);
        };
        f.click();
    };

    // ============ DRAG TOOLS INTO / OUT OF THE 3-DOT MENU ============

    window.handleToolDragStart = (e, id) => {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
    };

    function checkBarTransparency() {
        const bar = document.getElementById('sidebar-left');
        const bgMain = document.getElementById('btn-bg-main');
        const bgLock = document.getElementById('btn-bg-lock');
        const anyToolStillOnBar = (bgMain && bgMain.parentElement === bar) || (bgLock && bgLock.parentElement === bar);
        bar.classList.toggle('bar-transparent', !anyToolStillOnBar);
    }

    window.handleToolDrop = (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const el = document.getElementById(id);
        if (!el) return;
        el.style.width = '100%';
        el.style.cursor = 'grab';
        document.getElementById('menu-tools-dropzone').appendChild(el);
        checkBarTransparency();
    };

    window.handleBarDrop = (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const el = document.getElementById(id);
        if (!el) return;
        el.style.width = '40px';
        el.style.cursor = 'grab';
        document.getElementById('sidebar-left').appendChild(el);
        checkBarTransparency();
    };

    // ============ END DRAG TOOLS ============

    // ============ LOCK SCREEN / PASSWORD LOGIC ============

    const passIn = document.getElementById('password');
    const passConfirmIn = document.getElementById('password-confirm');
    const lockTitle = document.getElementById('lock-title');
    const loginBtn = document.getElementById('loginBtn');

    function initLockScreen() {
        const storedPass = localStorage.getItem('cl_vF_pass');

        if (!passEnabled) {
            // No password required — skip straight in
            document.getElementById('lock-screen').classList.add('hidden');
            const mainVid = document.getElementById('bg-video');
            if (mainVid) mainVid.play().catch(()=>{});
            return;
        }

        if (!storedPass) {
            // First run with lock enabled but no key chosen yet — ask them to create one
            setupMode = true;
            lockTitle.innerText = 'CREATE ACCESS KEY';
            passIn.placeholder = 'NEW ACCESS KEY';
            passConfirmIn.style.display = 'block';
            loginBtn.innerText = 'Set Access Key';
        } else {
            setupMode = false;
            lockTitle.innerText = 'ACCESS KEY';
            passIn.placeholder = 'ACCESS KEY';
            passConfirmIn.style.display = 'none';
            loginBtn.innerText = 'Unlock';
        }

        setTimeout(() => passIn.focus(), 500);
    }

    function unlockUI() {
        document.getElementById('lock-screen').classList.add('hidden');
        const mainVid = document.getElementById('bg-video');
        if (mainVid) mainVid.play().catch(()=>{});
    }

    function flashError(el) {
        el.style.borderColor = "red"; el.value = "";
        setTimeout(() => el.style.borderColor = "rgba(255,255,255,0.1)", 1000);
    }

    function login() {
        if (setupMode) {
            const p1 = passIn.value;
            const p2 = passConfirmIn.value;
            if (!p1) { flashError(passIn); return; }
            if (p1 !== p2) { flashError(passConfirmIn); return; }
            localStorage.setItem('cl_vF_pass', p1);
            localStorage.setItem('cl_vF_passEnabled', 'true');
            passEnabled = true;
            updatePassMenuLabel();
            unlockUI();
            return;
        }
        const storedPass = localStorage.getItem('cl_vF_pass');
        if (passIn.value === storedPass) {
            unlockUI();
        } else {
            flashError(passIn);
        }
    }

    passIn.addEventListener('keypress', (e) => { if(e.key==='Enter') login(); });
    passConfirmIn.addEventListener('keypress', (e) => { if(e.key==='Enter') login(); });
    loginBtn.onclick = login;

    // Settings menu (3-dot, top-left)
    window.togglePasswordLock = () => {
        passEnabled = !passEnabled;
        localStorage.setItem('cl_vF_passEnabled', passEnabled ? 'true' : 'false');

        if (passEnabled && !localStorage.getItem('cl_vF_pass')) {
            const p = prompt("Choose an access key:");
            if (p) {
                localStorage.setItem('cl_vF_pass', p);
            } else {
                // No key given — revert to off
                passEnabled = false;
                localStorage.setItem('cl_vF_passEnabled', 'false');
            }
        }
        updatePassMenuLabel();
    };

    window.changePassword = () => {
        const p1 = prompt("Enter new access key:");
        if (!p1) return;
        const p2 = prompt("Confirm new access key:");
        if (p1 !== p2) { alert("Keys didn't match — nothing changed."); return; }
        localStorage.setItem('cl_vF_pass', p1);
        alert("Access key updated.");
    };

    function updatePassMenuLabel() {
        const label = document.getElementById('pass-toggle-label');
        if (label) label.innerText = passEnabled ? 'Password Lock: ON' : 'Password Lock: OFF';
        const changeItem = document.getElementById('change-pass-item');
        if (changeItem) changeItem.style.display = passEnabled ? 'flex' : 'none';
    }

    // ============ END LOCK SCREEN LOGIC ============

    // ============ APPEARANCE (FONT / TEXT COLOR / TEXT SIZE) ============

    function applyAppearance() {
        document.documentElement.style.setProperty('--app-font', appFont);
        document.documentElement.style.setProperty('--text-color', textColor);
        document.documentElement.style.setProperty('--text-scale', textScale);
    }

    function loadGoogleFont(name) {
        const linkId = 'dynamic-google-font';
        let link = document.getElementById(linkId);
        if (!link) {
            link = document.createElement('link');
            link.id = linkId;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
        }
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g, '+')}&display=swap`;
    }

    window.changeFont = (val) => {
        if (val === 'custom') {
            const name = prompt("Enter a Google Font name (e.g. 'Poppins', 'Roboto Mono'):");
            if (!name) {
                // Revert the select back to whatever is actually active
                syncFontSelect();
                return;
            }
            loadGoogleFont(name);
            appFont = `'${name}', sans-serif`;
        } else {
            appFont = val;
        }
        localStorage.setItem('cl_vF_font', appFont);
        applyAppearance();
    };

    function syncFontSelect() {
        const select = document.getElementById('font-select');
        if (!select) return;
        if (FONT_PRESETS.includes(appFont)) {
            select.value = appFont;
        } else {
            // A custom Google Font is active — add/select a matching option
            let customOpt = select.querySelector('option[value="__current-custom__"]');
            if (!customOpt) {
                customOpt = document.createElement('option');
                customOpt.value = '__current-custom__';
                select.insertBefore(customOpt, select.querySelector('option[value="custom"]'));
            }
            const nameMatch = appFont.match(/^'([^']+)'/);
            customOpt.textContent = nameMatch ? nameMatch[1] : 'Custom Font';
            select.value = '__current-custom__';
            // Re-apply the Google Font <link> in case of a fresh page load
            if (nameMatch) loadGoogleFont(nameMatch[1]);
        }
    }

    function initAppearanceControls() {
        const fontSelect = document.getElementById('font-select');
        const colorPicker = document.getElementById('text-color-picker');
        const sizeSlider = document.getElementById('text-size-slider');

        syncFontSelect();
        colorPicker.value = textColor;
        sizeSlider.value = Math.round(textScale * 100);

        fontSelect.onchange = (e) => {
            if (e.target.value === '__current-custom__') return; // already-active custom option, no-op
            window.changeFont(e.target.value);
        };

        colorPicker.oninput = (e) => {
            textColor = e.target.value;
            localStorage.setItem('cl_vF_textColor', textColor);
            applyAppearance();
        };

        sizeSlider.oninput = (e) => {
            textScale = e.target.value / 100;
            localStorage.setItem('cl_vF_textScale', textScale);
            applyAppearance();
        };

        applyAppearance();
    }

    // ============ END APPEARANCE ============

    function updateHue(h) {
        document.documentElement.style.setProperty('--accent-hue', h);
        localStorage.setItem('vault_hue', h);
        document.getElementById('hue-slider').value = h;
    }
    document.getElementById('hue-slider').oninput = (e) => updateHue(e.target.value);

    window.toggleSidebarMenu = (e) => {
        e.stopPropagation();
        const m = document.getElementById('sidebar-context');
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    };

    window.closeAllMenus = () => document.querySelectorAll('.context-menu').forEach(m => m.style.display = 'none');

    window.toggleMenu = (e, id) => {
        e.stopPropagation();
        const m = document.getElementById(id);
        const isVisible = m.style.display === 'block';
        closeAllMenus();
        if(!isVisible) m.style.display = 'block';
    };

    window.toggleFolder = (name) => {
        openFolders = openFolders.includes(name) ? openFolders.filter(f => f !== name) : [...openFolders, name];
        localStorage.setItem('cl_vF_openFolders', JSON.stringify(openFolders));
        render();
    };

    function render() {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = '';
        library.filter(i => !i.folder).forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            // Escape names for HTML attributes
            const fSub = folders.map(f => `<div class="menu-item" onclick="moveItem(${item.id}, '${safeStr(f.name)}')">${f.name}</div>`).join('');

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div style="font-size:calc(10px * var(--text-scale)); font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:10px; flex:1;">${item.label}</div>
                    <div class="card-dots" onclick="toggleMenu(event, 'm-${item.id}')">⋮</div>
                </div>
                <div id="m-${item.id}" class="context-menu" style="top:25px; right:5px;">
                    <div class="menu-item" onclick="renameItem(${item.id})">Rename</div>
                    <div class="menu-item">Move To <span>▶</span><div class="submenu-inner">${fSub || '<div class="menu-item">No Folders</div>'}</div></div>
                    <div class="menu-item" style="color:red;" onclick="deleteItem(${item.id})">Delete</div>
                </div>
                <div style="aspect-ratio:16/9; background:#111; margin-bottom:12px; overflow:hidden;">
                    <img src="${item.thumb}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/320x180/111/fff?text=Link'">
                </div>
                <button class="mist-btn" style="width:100%;" onclick="window.open('${safeStr(item.url)}','_blank', 'noopener,noreferrer')">LAUNCH</button>
            `;
            grid.appendChild(card);
        });

        const tabList = document.getElementById('folder-tab-list');
        tabList.innerHTML = '';
        folders.forEach(f => {
            const isOpen = openFolders.includes(f.name);
            const container = document.createElement('div');
            // Unique ID generation based on loop index or random would be better, but name works if clean
            const safeNameId = f.name.replace(/[^a-zA-Z0-9]/g, '');
            const safeFName = safeStr(f.name);

            container.innerHTML = `
                <div class="folder-header">
                    <div class="folder-name-group" onclick="toggleFolder('${safeFName}')">
                        <span style="font-size:calc(8px * var(--text-scale)); opacity:0.3;">${isOpen ? '▼' : '▶'}</span>
                        <span style="font-size:calc(11px * var(--text-scale)); font-weight:600; text-transform:uppercase;">${f.name}</span>
                    </div>
                    <div class="card-dots" style="position:relative;" onclick="toggleMenu(event, 'f-opt-${safeNameId}')">⋮</div>
                    <div id="f-opt-${safeNameId}" class="context-menu" style="right:0; margin-top:25px;">
                        <div class="menu-item" onclick="renameFolder('${safeFName}')">Rename</div>
                        <div class="menu-item" style="color:red;" onclick="deleteFolder('${safeFName}')">Delete</div>
                    </div>
                </div>
                <div class="folder-content ${isOpen ? 'open' : ''}">${renderFolderLinks(f.name)}</div>
            `;
            tabList.appendChild(container);
        });
    }

    function renderFolderLinks(fName) {
        const links = library.filter(i => i.folder === fName);
        if(!links.length) return '<div style="font-size:calc(8px * var(--text-scale)); opacity:0.2; text-align:center;">Empty</div>';

        // Find latest item safely
        const latestItem = links.reduce((prev, current) => {
            return ((prev.movedAt || 0) > (current.movedAt || 0)) ? prev : current;
        }, links[0]);

        return links.map(l => {
            const isFresh = (l.movedAt && (Date.now() - l.movedAt < 18000000)) && l.id === latestItem.id;
            return `
                <div class="folder-link-item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:calc(9px * var(--text-scale)); font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; cursor:pointer;" onclick="window.open('${safeStr(l.url)}','_blank', 'noopener,noreferrer')">
                            ${l.label}${isFresh ? '<span class="new-badge">NEW</span>' : ''}
                        </span>
                        <div class="card-dots" style="position:relative;" onclick="toggleMenu(event, 'f-m-${l.id}')">⋮</div>
                    </div>
                    <div id="f-m-${l.id}" class="context-menu" style="right:10px; margin-top:5px; z-index:4000;">
                        <div class="menu-item" onclick="window.open('${safeStr(l.url)}','_blank', 'noopener,noreferrer')">Open</div>
                        <div class="menu-item" onclick="renameItem(${l.id})">Rename</div>
                        <div class="menu-item" onclick="moveItem(${l.id}, '')">Remove Folder</div>
                        <div class="menu-item" style="color:red;" onclick="deleteItem(${l.id})">Delete</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.moveItem = (id, fName) => {
        const idx = library.findIndex(i => i.id === id);
        if(idx !== -1) {
            library[idx].folder = fName;
            library[idx].movedAt = Date.now();
            sync();
        }
    };

    window.renameFolder = (oldN) => {
        const newN = prompt("New Name:", oldN);
        if(newN && newN !== oldN) {
            folders = folders.map(f => f.name === oldN ? {name: newN} : f);
            library.forEach(i => { if(i.folder === oldN) i.folder = newN; });
            // Fix open folders list
            openFolders = openFolders.map(f => f === oldN ? newN : f);
            localStorage.setItem('cl_vF_openFolders', JSON.stringify(openFolders));
            sync();
        }
    };

    window.renameItem = (id) => {
        const i = library.find(item => item.id === id);
        if(!i) return;
        const n = prompt("Rename Link:", i.label);
        if(n) { i.label = n; sync(); }
    };

    window.deleteFolder = (n) => {
        if(!confirm("Delete folder " + n + "? Links will be moved to main.")) return;
        folders = folders.filter(f => f.name !== n);
        library.forEach(i => {if(i.folder===n) i.folder='';});
        sync();
    };

    window.createNewFolder = () => { const n = prompt("Folder Name:"); if(n) { folders.push({name:n}); sync(); } };
    window.deleteItem = (id) => { library = library.filter(i => i.id !== id); sync(); };

    function sync() {
        localStorage.setItem('cl_vF_links', JSON.stringify(library));
        localStorage.setItem('cl_vF_folders', JSON.stringify(folders));
        render();
    }

    const addBtn = document.getElementById('addCardBtn');
    const urlIn = document.getElementById('url-input');
    urlIn.addEventListener('keypress', (e) => { if(e.key === 'Enter') addBtn.click(); });

    addBtn.onclick = async () => {
        const val = urlIn.value.trim(); if(!val) return;
        const url = val.startsWith('http') ? val : `https://${val}`;
        addBtn.innerText = 'FETCHING...'; addBtn.disabled = true;
        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            library.unshift({ id: Date.now(), label: data.data.title || url, url: url, thumb: data.data.image?.url || '', folder: "", movedAt: 0 });
            sync();
        } catch (e) {
            library.unshift({ id: Date.now(), label: url, url: url, thumb: '', folder: "", movedAt: 0 });
            sync();
        }
        addBtn.innerText = 'ADD TO VAULT'; addBtn.disabled = false; urlIn.value = '';
    };
});
</script>
</body>
</html>
